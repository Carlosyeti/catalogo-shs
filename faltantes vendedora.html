  .sb-logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-bottom:22px}

  .sb-btn.active{background:rgba(255,255,255,.14);color:white}
  .sb-spacer{flex:1}
  .sb-logout{width:40px;height:40px;border-radius:10px;background:none;border:none;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;margin-top:auto;margin-bottom:4px}

  .sidebar-inner{display:flex;flex-direction:column;align-items:center;height:100%;width:100%}
  .crumb{display:flex;align-items:center;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
  .crumb .path{font-size:12.5px;color:#64748b;font-weight:600}
  .brand-logo{font-size:15px;font-weight:800;color:#1e4bcc;letter-spacing:-.01em}
  .brand-logo span{color:#7ac143;margin-left:1px}
  .crumb a{font-size:12.5px;color:#5B6B64;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:4px}
  .crumb .sep{color:#c9c6ba}
  @media(max-width:640px){
    body{padding-left:0}
    .sidebar{display:none}
  }

  .section { background: white; margin: 12px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .search-input:focus { outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,0.1); }

  .dropdown { max-height: 220px; overflow-y: auto; border: 1.5px solid #e5e7eb; border-radius: 8px; margin-top: 6px; display: none; background: white; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .dropdown.open { display: block; }
  .dropdown-item { padding: 11px 14px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
  .dropdown-item:hover { background: #f0f4f8; }
  .dropdown-item .clave { font-size: 0.75rem; color: #9ca3af; font-family: monospace; }

  .selected-badge { background: #e8f0fe; border: 1.5px solid #1e3a5f; border-radius: 8px; padding: 10px 14px; margin-top: 8px; display: none; }

  .selected-badge .name { font-weight: 600; font-size: 0.95rem; color: #1e3a5f; }
  .selected-badge .clear { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1.2rem; padding: 0 4px; }

  .articulo-section { display: none; }
  .articulo-section.show { display: block; }

  .qty-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .qty-input { width: 100px; padding: 10px 12px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 1rem; text-align: center; }
  .qty-input:focus { outline: none; border-color: #1e3a5f; }
  .unidad-label { font-size: 0.85rem; color: #6b7280; }

  .btn-agregar { width: 100%; margin-top: 14px; padding: 13px; background: #1e3a5f; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
  .btn-agregar:hover { background: #162d4a; }
  .btn-agregar:disabled { background: #9ca3af; cursor: not-allowed; }

  .faltantes-list { margin: 0 12px 12px; }
  .faltantes-title { font-size: 0.75rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; padding: 0 4px; }
  
  .grupo-cliente { margin-bottom: 14px; }

  .grupo-nombre { font-size: 0.82rem; font-weight: 700; color: white; }

  .grupo-badge.comprado { background: #10b981; }
  .faltante-card { background: white; padding: 12px 14px; border-bottom: 1px solid #f3f4f6; border-left: 3px solid #1e3a5f; }

  .faltante-card.comprado { border-left-color: #10b981; background: #f9fafb; }
  .fc-row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }

  

  .empty-state { text-align: center; padding: 40px 20px; color: #9ca3af; }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }

  </div>

  </div>
</div>

// ────── STATE ──────
let vendedora = "";
let clienteActual = null;
let articuloActual = null;
let misFaltantes = [];

// ────── VENDEDORA SELECT ──────
document.getElementById('vendedoraSelect').addEventListener('change', function() {
  vendedora = this.value;
  document.getElementById('mainContent').style.display = vendedora ? 'block' : 'none';
  if (vendedora) {
    cargarMisFaltantes();
  }
});

// ────── TABS ──────
window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'captura') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tabCaptura').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tabListaContent').classList.add('active');
  }
};

// ────── CLIENTE SEARCH ──────
const clienteSearch = document.getElementById('clienteSearch');
const clienteDropdown = document.getElementById('clienteDropdown');

clienteSearch.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (q.length < 1) { clienteDropdown.classList.remove('open'); return; }
  
  const filtered = CLIENTES.filter(c => 
    c.nombre.toLowerCase().includes(q) || c.clave.toLowerCase().includes(q)
  ).slice(0, 30);

  if (filtered.length === 0) {
    clienteDropdown.innerHTML = '<div class="dropdown-item" style="color:#9ca3af">Sin resultados</div>';
  } else {
    clienteDropdown.innerHTML = filtered.map(c => 
      `<div class="dropdown-item" onclick="selectCliente('${c.clave}','${c.nombre.replace(/'/g,"&#39;")}','${c.vendedor}')">
        <span>${c.nombre}</span>
        <span class="clave">${c.clave}</span>
      </div>`
    ).join('');
  }
  clienteDropdown.classList.add('open');
});

window.selectCliente = function(clave, nombre, vendedorCliente) {
  clienteActual = { clave, nombre, vendedor: vendedorCliente };
  clienteDropdown.classList.remove('open');
  clienteSearch.value = '';
  document.getElementById('clienteNombre').textContent = `[${clave}] ${nombre}`;
  document.getElementById('clienteSelected').classList.add('show');
  document.getElementById('articuloSection').classList.add('show');
};

window.clearCliente = function() {
  clienteActual = null;
  articuloActual = null;
  document.getElementById('clienteSelected').classList.remove('show');
  document.getElementById('articuloSection').classList.remove('show');
  document.getElementById('articuloSelected').classList.remove('show');
  document.getElementById('qtyRow').style.display = 'none';
  document.getElementById('btnAgregar').disabled = true;
  document.getElementById('cantidadInput').value = '';
  clienteSearch.value = '';
};

// ────── ARTICULO SEARCH ──────
const articuloSearch = document.getElementById('articuloSearch');
const articuloDropdown = document.getElementById('articuloDropdown');

articuloSearch.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (q.length < 1) { articuloDropdown.classList.remove('open'); return; }
  
  const filtered = ARTICULOS.filter(a => 
    a.nombre.toLowerCase().includes(q) || a.clave.toLowerCase().includes(q)
  ).slice(0, 30);

  if (filtered.length === 0) {
    articuloDropdown.innerHTML = '<div class="dropdown-item" style="color:#9ca3af">Sin resultados</div>';
  } else {
    articuloDropdown.innerHTML = filtered.map(a => 
      `<div class="dropdown-item" onclick="selectArticulo('${a.clave}','${a.nombre.replace(/'/g,"&#39;")}','${a.unidad}')">
        <span>${a.nombre}</span>
        <span class="clave">${a.clave}</span>
      </div>`
    ).join('');
  }
  articuloDropdown.classList.add('open');
});

window.selectArticulo = function(clave, nombre, unidad) {
  articuloActual = { clave, nombre, unidad };
  articuloDropdown.classList.remove('open');
  articuloSearch.value = '';
  document.getElementById('articuloNombre').textContent = nombre;
  document.getElementById('articuloClave').textContent = clave + ' · ' + unidad;
  document.getElementById('articuloSelected').classList.add('show');
  document.getElementById('unidadLabel').textContent = unidad || 'PIEZA';
  document.getElementById('qtyRow').style.display = 'flex';
  checkBtnAgregar();
};

document.getElementById('cantidadInput').addEventListener('input', checkBtnAgregar);

function checkBtnAgregar() {
  const qty = parseInt(document.getElementById('cantidadInput').value);
  document.getElementById('btnAgregar').disabled = !(articuloActual && qty > 0);
}

// ────── AGREGAR FALTANTE ──────
window.agregarFaltante = async function() {
  const qty = parseInt(document.getElementById('cantidadInput').value);
  if (!clienteActual || !articuloActual || !qty) return;

  const faltante = {
    vendedora,
    cliente_clave: clienteActual.clave,
    cliente_nombre: clienteActual.nombre,
    articulo_clave: articuloActual.clave,
    articulo_nombre: articuloActual.nombre,
    unidad: articuloActual.unidad,
    cantidad: qty,
    comprado: false,
    timestamp: Date.now()
  };

  try {
    await db.ref('faltantes').push(faltante);
    showToast('✅ Faltante registrado');
    // Reset articulo
    articuloActual = null;
    document.getElementById('articuloSelected').classList.remove('show');
    document.getElementById('qtyRow').style.display = 'none';
    document.getElementById('btnAgregar').disabled = true;
    document.getElementById('cantidadInput').value = '';
    articuloSearch.value = '';
  } catch(e) {
    showToast('❌ Error al guardar: ' + e.message);
  }
};

// ────── MIS FALTANTES ──────
function cargarMisFaltantes() {
  db.ref('faltantes').on('value', (snap) => {
    misFaltantes = [];
    if (snap.exists()) {
      snap.forEach(child => {
        const d = child.val();
        if (d.vendedora === vendedora) {
          misFaltantes.push({ id: child.key, ...d });
        }
      });
    }
    misFaltantes.sort((a,b) => b.timestamp - a.timestamp);
    renderMisFaltantes();
    document.getElementById('miContador').textContent = misFaltantes.filter(f => !f.comprado).length;
  });
}

function renderMisFaltantes() {
  const list = document.getElementById('misFaltantesList');
  if (misFaltantes.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div>No tienes faltantes reportados</div>';
    return;
  }

  // Agrupar por cliente
  const grupos = {};
  misFaltantes.forEach(f => {
    const key = f.cliente_clave + '||' + f.cliente_nombre;
    if (!grupos[key]) grupos[key] = [];
    grupos[key].push(f);
  });

  let html = '';
  for (const [key, items] of Object.entries(grupos)) {
    const [clave, nombre] = key.split('||');
    const pendCount = items.filter(i => !i.comprado).length;
    html += `
      <div class="grupo-cliente">
        <div class="grupo-header">
          <span class="grupo-nombre">🏢 [${clave}] ${nombre}</span>
          ${pendCount > 0 ? `<span class="grupo-badge">${pendCount} pend.</span>` : '<span class="grupo-badge comprado">✅ todo comprado</span>'}
        </div>
        ${items.map(f => `
          <div class="faltante-card ${f.comprado ? 'comprado' : ''}">
            <div class="fc-articulo">${f.articulo_nombre}</div>
            <div class="fc-clave">${f.articulo_clave}</div>
            <div class="fc-row">
              <div class="fc-qty">Cantidad: ${f.cantidad} ${f.unidad}</div>
              ${f.comprado ? '<span class="fc-comprado-badge">✅ COMPRADO</span>' : ''}
            </div>
            <div class="fc-meta">${new Date(f.timestamp).toLocaleString('es-MX', {dateStyle:'short', timeStyle:'short'})}</div>
          </div>
        `).join('')}
      </div>`;
  }
  list.innerHTML = html;
}

// ────── TOAST ──────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Close dropdowns on outside click
document.addEventListener('click', function(e) {
  if (!clienteSearch.contains(e.target) && !clienteDropdown.contains(e.target)) {
    clienteDropdown.classList.remove('open');
  }
  if (!articuloSearch.contains(e.target) && !articuloDropdown.contains(e.target)) {
    articuloDropdown.classList.remove('open');
  }
});
</script>
