<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel SHS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<script src="tools-data.js"></script>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F7F5F0;color:#15241F;display:flex;min-height:100vh}

.sidebar{width:64px;background:#173F35;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;flex-shrink:0}
.sb-logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;margin-bottom:22px}
.sb-btn{width:40px;height:40px;border-radius:10px;background:none;border:none;color:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;transition:.15s}
.sb-btn:hover{background:rgba(255,255,255,.08);color:white}
.sb-btn.active{background:rgba(255,255,255,.14);color:white}
.sb-spacer{flex:1}
.sb-logout{width:40px;height:40px;border-radius:10px;background:none;border:none;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;margin-top:auto;margin-bottom:4px}
.sb-logout:hover{background:rgba(255,80,80,.14);color:#ffb4b4}
.sidebar-inner{display:flex;flex-direction:column;align-items:center;height:100%;width:100%}

.main{flex:1;min-width:0;padding:32px 40px 60px;max-width:1180px;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.brand-logo{font-size:19px;font-weight:800;color:#1e4bcc;letter-spacing:-.01em;margin-bottom:6px}
.brand-logo span{color:#7ac143;margin-left:1px}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.top p{font-size:13.5px;color:#64748b;margin-top:3px}
.top-right{display:flex;align-items:center;gap:14px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid #e5e3da;background:white;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:17px;cursor:pointer;position:relative}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:#e24b4a}
.user-chip{display:flex;align-items:center;gap:9px;background:white;border:1px solid #e5e3da;border-radius:24px;padding:5px 12px 5px 5px;cursor:pointer}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#173F35;color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.user-chip span{font-size:13px;font-weight:600}
.user-chip i{font-size:14px;color:#94a3b8}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:340px}
.search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:#94a3b8}
.search input{width:100%;height:40px;border-radius:22px;border:1px solid #e5e3da;background:white;padding:0 16px 0 38px;font-size:13.5px;font-family:inherit;outline:none}
.search input:focus{border-color:#173F35;box-shadow:0 0 0 3px rgba(23,63,53,.08)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid #e5e3da;background:white;color:#5B6B64;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:22px;cursor:pointer;transition:.12s}
.pill:hover{border-color:#173F35}
.pill.active{background:#173F35;border-color:#173F35;color:white}

.banner{display:flex;align-items:center;gap:10px;background:white;border:1px solid #e5e3da;border-radius:12px;padding:12px 16px;margin-bottom:26px;font-size:13px}
.banner .who{display:flex;align-items:center;gap:8px;font-weight:600}
.banner .count{margin-left:auto;display:flex;align-items:center;gap:6px;color:#1F7A4D;font-weight:600;background:#EAF6EF;padding:4px 11px;border-radius:20px;font-size:12.5px}

section.cat{margin-bottom:30px}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.cat-chip{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-chip i{font-size:15px}
.cat-head h2{font-size:14px;font-weight:700}
.cat-head .n{font-size:12px;color:#94a3b8;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.card{position:relative;background:white;border:1px solid #e5e3da;border-radius:14px;padding:16px;text-decoration:none;color:inherit;display:block;transition:.15s}
.card:hover{border-color:#173F35;transform:translateY(-2px);box-shadow:0 8px 18px rgba(20,30,25,.07)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px}
.icon-chip{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.icon-chip i{font-size:19px}
.fav-btn{background:none;border:none;color:#cbd5c9;font-size:16px;cursor:pointer;padding:2px}
.fav-btn.active{color:#e8a93b}
.card h3{font-size:14px;font-weight:600;margin-bottom:4px}
.card p{font-size:12px;color:#64748b;line-height:1.5;margin-bottom:12px;min-height:32px}
.card .open{font-size:12.5px;font-weight:700;color:#1F7A4D;display:flex;align-items:center;gap:4px}
.card .open i{font-size:14px}

.empty{text-align:center;color:#94a3b8;font-size:13.5px;padding:40px 0}
.chip-ventas{background:#FAECE7}.chip-ventas i{color:#993C1D}
.chip-finanzas{background:#EEEDFE}.chip-finanzas i{color:#534AB7}
.chip-logistica{background:#E6F1FB}.chip-logistica i{color:#185FA5}
.chip-rrhh{background:#E1F5EE}.chip-rrhh i{color:#0F6E56}
.chip-admin{background:#F1EFE8}.chip-admin i{color:#5F5E5A}

@media(max-width:640px){.main{padding:24px 16px 60px}}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-inner">
    <div class="sb-logo">SHS</div>
    <button class="sb-btn active" id="navHome" title="Inicio"><i class="ti ti-home" aria-hidden="true"></i></button>
    <button class="sb-btn" id="navAll" title="Todas"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
    <button class="sb-btn" id="navFav" title="Favoritos"><i class="ti ti-star" aria-hidden="true"></i></button>
    <button class="sb-btn" id="navRecent" title="Recientes"><i class="ti ti-clock" aria-hidden="true"></i></button>
    <button class="sb-btn" id="navSettings" title="Usuarios y permisos"><i class="ti ti-settings" aria-hidden="true"></i></button>
    <div class="sb-spacer"></div>
    <button class="sb-logout" id="btnLogout" title="Cerrar sesión"><i class="ti ti-logout" aria-hidden="true"></i></button>
  </div>
</nav>

<div class="main">
  <div class="top">
    <div>
      <div class="brand-logo">SHS<span>&#10003;</span></div>
      <h1>Panel SHS</h1>
      <p>Acceso centralizado a tus herramientas según tu rol</p>
    </div>
    <div class="top-right">
      <button class="icon-btn" title="Ayuda"><i class="ti ti-help" aria-hidden="true"></i></button>
      <button class="icon-btn" title="Notificaciones"><span class="dot"></span><i class="ti ti-bell" aria-hidden="true"></i></button>
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">?</div>
        <span id="userNombre">…</span>
        <i class="ti ti-chevron-down" aria-hidden="true"></i>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="search">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="search" placeholder="Buscar herramienta…" autocomplete="off">
    </div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="banner">
    <div class="who"><i class="ti ti-user-circle" aria-hidden="true"></i><span id="vistaLabel">Vista de …</span></div>
    <div class="count"><i class="ti ti-check" aria-hidden="true"></i><span id="countLabel">0 herramientas disponibles</span></div>
  </div>

  <div id="cats"></div>
</div>

<script>
window.SHS_CUSTOM_SHELL = true;
var session = shsRequireAccess();
var permisos = session.permisos || {};

// Solo se muestran las herramientas que el usuario puede abrir. Las que no
// tienen candado propio (gated:false, ej. el catálogo público) se incluyen
// si el usuario tiene algún permiso en esa misma área.
var misTools = SHS_TOOLS.filter(function(t){
  if(t.gated) return !!permisos[t.id];
  return SHS_TOOLS.some(function(o){ return o.cat===t.cat && o.gated && permisos[o.id]; });
});
var misCatKeys = SHS_CATEGORIAS.map(function(c){return c.key;})
  .filter(function(k){ return misTools.some(function(t){ return t.cat===k; }); });

var CATEGORIAS = SHS_CATEGORIAS.map(function(c){
  return {key:c.key, label:c.label, icon:c.icon, tools: misTools.filter(function(t){ return t.cat===c.key; })};
}).filter(function(c){ return c.tools.length>0; });

var totalMis = misTools.length;
var totalGeneral = SHS_TOOLS.length;

function vistaLabel(){
  var todasGated = SHS_TOOLS.filter(function(t){ return t.gated; });
  var tengoTodas = todasGated.every(function(t){ return permisos[t.id]; });
  if(tengoTodas) return 'Administrador';
  if(misCatKeys.length === 0) return 'Sin herramientas asignadas';
  if(misCatKeys.length === 1){
    var c = SHS_CATEGORIAS.find(function(c){ return c.key===misCatKeys[0]; });
    return c.label;
  }
  return misCatKeys.map(function(k){ return SHS_CATEGORIAS.find(function(c){return c.key===k;}).label.split(' ')[0]; }).join(' + ');
}

document.getElementById('userNombre').textContent = session.nombre;
document.getElementById('userAvatar').textContent = session.nombre.trim().charAt(0).toUpperCase();
document.getElementById('vistaLabel').textContent = 'Vista de ' + vistaLabel();
document.getElementById('countLabel').textContent = totalMis + ' de ' + totalGeneral + ' herramientas disponibles';

document.getElementById('btnLogout').addEventListener('click', shsLogout);
document.getElementById('navSettings').addEventListener('click', function(){
  if(permisos.usuarios_permisos) window.location.href = 'usuarios.html';
});

// ── favoritos / recientes (preferencia local del navegador) ──
function getSet(key){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; } }
function saveSet(key, arr){ localStorage.setItem(key, JSON.stringify(arr)); }
function toggleFav(name){
  var favs = getSet('shs_favoritos');
  var i = favs.indexOf(name);
  if(i>-1) favs.splice(i,1); else favs.push(name);
  saveSet('shs_favoritos', favs);
}
function marcarReciente(name){
  var rec = getSet('shs_recientes').filter(function(n){ return n!==name; });
  rec.unshift(name);
  saveSet('shs_recientes', rec.slice(0,8));
}

var query = '';
var vista = 'home'; // home | all | fav | recent | <categoria>

function pillsDisponibles(){
  return CATEGORIAS;
}

function render(){
  var disponibles = pillsDisponibles();

  document.getElementById('pills').innerHTML = disponibles.map(function(c){
    return '<button class="pill'+(vista===c.key?' active':'')+'" data-cat="'+c.key+'">'+c.label.split(' ')[0]+'</button>';
  }).join('');
  document.querySelectorAll('.pill').forEach(function(b){
    b.addEventListener('click', function(){ vista = (vista===b.dataset.cat) ? 'home' : b.dataset.cat; render(); });
  });

  document.querySelectorAll('.sb-btn').forEach(function(b){ b.classList.remove('active'); });
  if(vista==='fav') document.getElementById('navFav').classList.add('active');
  else if(vista==='recent') document.getElementById('navRecent').classList.add('active');
  else if(vista==='all') document.getElementById('navAll').classList.add('active');
  else if(vista==='home') document.getElementById('navHome').classList.add('active');

  var favoritos = getSet('shs_favoritos');
  var recientes = getSet('shs_recientes');

  function matches(t){
    if(query && !(t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query))) return false;
    if(vista==='fav') return favoritos.indexOf(t.name)>-1;
    if(vista==='recent') return recientes.indexOf(t.name)>-1;
    return true;
  }

  var html = '';
  var visibleCats = disponibles.filter(function(c){ return vista==='home' || vista==='all' || vista===c.key || vista==='fav' || vista==='recent'; });

  visibleCats.forEach(function(cat){
    var tools = cat.tools.filter(matches);
    if(vista===cat.key || vista==='home' || vista==='all'){ /* keep as-is */ }
    if(tools.length===0) return;
    var cards = tools.map(function(t){
      var isFav = favoritos.indexOf(t.name)>-1;
      return '<a class="card" href="'+encodeURI(t.href)+'" data-name="'+t.name+'">'+
        '<div class="card-top"><div class="icon-chip chip-'+cat.key+'"><i class="ti '+t.icon+'" aria-hidden="true"></i></div>'+
        '<button type="button" class="fav-btn'+(isFav?' active':'')+'" data-fav="'+t.name+'" aria-label="Favorito"><i class="ti ti-star" aria-hidden="true"></i></button></div>'+
        '<h3>'+t.name+'</h3><p>'+t.desc+'</p>'+
        '<span class="open">Abrir <i class="ti ti-arrow-right" aria-hidden="true"></i></span></a>';
    }).join('');
    html += '<section class="cat"><div class="cat-head"><div class="cat-chip chip-'+cat.key+'"><i class="ti '+cat.icon+'" aria-hidden="true"></i></div>'+
      '<h2>'+cat.label+'</h2><span class="n">'+tools.length+' herramienta'+(tools.length===1?'':'s')+'</span></div>'+
      '<div class="grid">'+cards+'</div></section>';
  });

  document.getElementById('cats').innerHTML = html || '<div class="empty">'+
    (vista==='fav' ? 'Todavía no marcaste favoritos. Haz clic en la estrella de una herramienta.' :
     vista==='recent' ? 'Todavía no abriste ninguna herramienta.' :
     misTools.length===0 ? 'Tu usuario no tiene herramientas asignadas. Pide acceso a un administrador.' :
     'Sin resultados para "'+query+'".') + '</div>';

  document.querySelectorAll('.fav-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      toggleFav(btn.dataset.fav);
      render();
    });
  });
  document.querySelectorAll('.card').forEach(function(card){
    card.addEventListener('click', function(){ marcarReciente(card.dataset.name); });
  });
}

document.getElementById('navHome').addEventListener('click', function(){ vista='home'; render(); });
document.getElementById('navAll').addEventListener('click', function(){ vista='all'; render(); });
document.getElementById('navFav').addEventListener('click', function(){ vista='fav'; render(); });
document.getElementById('navRecent').addEventListener('click', function(){ vista='recent'; render(); });
document.getElementById('search').addEventListener('input', function(e){ query = e.target.value.trim().toLowerCase(); render(); });

render();
</script>
</body>
</html>
